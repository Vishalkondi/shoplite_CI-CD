<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1e293b" flood-opacity=".12"/></filter></defs><rect width="1400" height="500" rx="24" fill="url(#bg)"/>
<text x="58" y="55" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="27" fill="#0f172a">ShopLite application architecture</text><text x="58" y="84" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#475569">Browser requests pass through Nginx to the Express API; PostgreSQL persists products, orders and inventory.</text>
<g font-family="Segoe UI,Arial,sans-serif" filter="url(#shadow)"><rect x="70" y="145" width="290" height="230" rx="18" fill="#fff" stroke="#cbd5e1"/><rect x="405" y="145" width="320" height="230" rx="18" fill="#fff" stroke="#93c5fd"/><rect x="770" y="145" width="260" height="230" rx="18" fill="#fff" stroke="#a7f3d0"/><rect x="1075" y="145" width="255" height="230" rx="18" fill="#fff" stroke="#c4b5fd"/></g>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><text x="215" y="185" font-size="20" font-weight="700" fill="#1e293b">Browser</text><text x="215" y="213" font-size="15" fill="#475569">Shopper UI</text><rect x="111" y="245" width="208" height="84" rx="12" fill="#dbeafe"/><text x="215" y="278" font-size="17" font-weight="700" fill="#1d4ed8">React + Vite</text><text x="215" y="303" font-size="14" fill="#1e40af">Cart • Checkout • Search</text>
<text x="565" y="185" font-size="20" font-weight="700" fill="#1e293b">Frontend container</text><text x="565" y="213" font-size="15" fill="#475569">Nginx</text><rect x="444" y="245" width="242" height="84" rx="12" fill="#e0e7ff"/><text x="565" y="278" font-size="17" font-weight="700" fill="#4338ca">Static files</text><text x="565" y="303" font-size="14" fill="#4338ca">/api/* proxy</text>
<text x="900" y="185" font-size="20" font-weight="700" fill="#1e293b">Backend container</text><text x="900" y="213" font-size="15" fill="#475569">Node.js 22 + Express 5</text><rect x="795" y="245" width="210" height="84" rx="12" fill="#d1fae5"/><text x="900" y="278" font-size="17" font-weight="700" fill="#047857">REST API</text><text x="900" y="303" font-size="14" fill="#065f46">Routes → services → SQL</text>
<text x="1202" y="185" font-size="20" font-weight="700" fill="#1e293b">Database container</text><text x="1202" y="213" font-size="15" fill="#475569">PostgreSQL 16</text><rect x="1105" y="245" width="195" height="84" rx="12" fill="#ede9fe"/><text x="1202" y="278" font-size="17" font-weight="700" fill="#6d28d9">shop database</text><text x="1202" y="303" font-size="14" fill="#5b21b6">Products • Orders • Stock</text></g>
<g stroke="#64748b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M360 260h39"/><path d="M389 250l10 10-10 10"/><path d="M725 260h39"/><path d="M754 250l10 10-10 10"/><path d="M1030 260h39"/><path d="M1059 250l10 10-10 10"/></g>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" font-size="13" fill="#475569"><text x="380" y="235">HTTP</text><text x="745" y="235">/api</text><text x="1050" y="235">SQL</text><text x="700" y="432" font-size="15" fill="#334155">Docker network: services communicate by service name (nginx → backend → db), not by container localhost.</text><text x="700" y="460" font-size="14" fill="#64748b">The named volume preserves PostgreSQL data across container recreation.</text></g></svg>