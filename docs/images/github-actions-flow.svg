<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1e293b" flood-opacity=".12"/></filter></defs><rect width="1400" height="520" rx="24" fill="url(#bg)"/>
<text x="55" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">GitHub Actions CI workflow</text><text x="55" y="83" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#475569">Push to main or open a pull request: backend and frontend checks run in parallel; Docker smoke tests run after both pass.</text>
<g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif"><rect x="65" y="150" width="230" height="100" rx="16" fill="#dbeafe" stroke="#93c5fd"/><rect x="385" y="120" width="330" height="130" rx="16" fill="#fff" stroke="#93c5fd"/><rect x="385" y="300" width="330" height="130" rx="16" fill="#fff" stroke="#a5b4fc"/><rect x="835" y="205" width="290" height="145" rx="16" fill="#dcfce7" stroke="#86efac"/><rect x="1180" y="205" width="165" height="145" rx="16" fill="#e0e7ff" stroke="#a5b4fc"/></g>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><text x="180" y="190" font-size="20" font-weight="700" fill="#1d4ed8">Push / Pull Request</text><text x="180" y="219" font-size="15" fill="#1e40af">GitHub event</text>
<text x="550" y="159" font-size="20" font-weight="700" fill="#1d4ed8">Backend job</text><text x="550" y="188" font-size="15" fill="#334155">npm ci → Jest tests</text><text x="550" y="214" font-size="14" fill="#475569">PostgreSQL service + coverage</text>
<text x="550" y="340" font-size="20" font-weight="700" fill="#4338ca">Frontend job</text><text x="550" y="369" font-size="15" fill="#334155">npm ci → tests → Vite build</text><text x="550" y="395" font-size="14" fill="#475569">Upload build artifact</text>
<text x="980" y="248" font-size="20" font-weight="700" fill="#166534">Docker job</text><text x="980" y="278" font-size="15" fill="#166534">Compose config + build</text><text x="980" y="304" font-size="14" fill="#166534">Start stack + smoke tests</text><text x="980" y="328" font-size="14" fill="#166534">Logs and cleanup</text>
<text x="1262" y="252" font-size="18" font-weight="700" fill="#4338ca">Result</text><text x="1262" y="281" font-size="14" fill="#4338ca">Artifacts</text><text x="1262" y="305" font-size="14" fill="#4338ca">Checks</text><text x="1262" y="329" font-size="14" fill="#4338ca">Status</text></g>
