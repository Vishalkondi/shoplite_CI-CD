<rect x="65" y="460" width="1280" height="35" rx="10" fill="#0f172a"/><text x="705" y="483" font-family="Segoe UI,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#f8fafc">Docker job runs only when the required backend and frontend jobs succeed.</text></svg>